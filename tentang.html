<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Kontak Minimalis</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fafb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1f2937;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px; /* Mencegah auto-zoom di iOS */
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="form-container">
    <form action="/submit" method="POST">
        <div class="form-group">
            <label id="label-nama" for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" required autocomplete="name" aria-labelledby="label-nama">
        </div>
        
        <div class="form-group">
            <label id="label-email" for="email">Alamat Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" aria-labelledby="label-email">
        </div>
        
        <div class="form-group">
            <label id="label-pesan" for="pesan">Pesan Anda</label>
            <textarea id="pesan" name="pesan" rows="4" required aria-labelledby="label-pesan"></textarea>
        </div>
        
        <button type="submit">Kirim Pesan</button>
    </form>
</div>

</body>
</html>
